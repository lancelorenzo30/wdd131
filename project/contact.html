<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Book Cuisinero Catering for your next event. Weddings, birthdays, and corporate events made special.">

    <link rel="stylesheet" href="styles/siteplan.css">
    <link rel="stylesheet" href="styles/siteplan-small.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&display=swap" rel="stylesheet">

    <script src="../scripts/getdates.js" defer></script>
    <script src="scripts/nav.js" defer></script>

    <title>Contact - Cuisnero</title>
</head>
<body>
    <header>
        <img class="logo" src="images/cuisinero.png" alt="Cuisinero" width="200">
        <nav id="nav-menu">
            <a href="siteplan.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <h2>Book an Event</h2>
        <form action="thanks.html" method="get" id="booking-form">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" name="email" id="email" required>
            </div>

            <div class="form-group">
                <label for="event">Event Type</label>
                <select name="event" id="event">
                    <option value="" disabled selected>Select an Event...</option>
                    <option value="birthday">Birthday</option>
                    <option value="business opening">Business Opening</option>
                    <option value="community service">Community Service</option>
                    <option value="corporate">Corporate</option>
                    <option value="funeral">Funeral</option>
                    <option value="holiday parties">Holiday Party</option>
                    <option value="private gathering">Private Gathering</option>
                    <option value="school event">School Event</option>
                    <option value="wedding">Wedding</option>
                </select>
            </div>

            <div class="form-group">
                <label for="guests">Number of Guests</label>
                <input type="number" name="number" id="number" min="1" required>
            </div>

            <div class="form-group">
                <label for="message">Note</label>
                <textarea name="message" id="message"></textarea>
            </div>

            <button type="submit">Book Now</button>
        </form>

    </main>
    <footer>
        <p><span id="currentyear"></span> 🍴 Cuisinero Catering 🍴 Philippines</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
