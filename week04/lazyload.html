<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A WDD 131 Activity pertaining the use of lazy loading for images">
    <meta name="author" content="Lance Lorenzo">

    <link rel="stylesheet" href="styles/lazyload.css">

    <script src="../scripts/getdates.js" defer></script>

    <title>Lazy Load Images</title>
</head>
<body>
    <main>
        <h1>Random Images</h1>
        <picture>
            <img src="images/random-img.webp" alt="Forest" width="400" height="600" loading="lazy">
            <img src="images/random-img2.webp" alt="Sheep on a Mountain" width="400" height="600" loading="lazy">
            <img src="images/random-img3.webp" alt="Stony part of a sea" width="400" height="600" loading="lazy">
            <img src="images/random-img4.webp" alt="Sea Shore" width="400" height="600" loading="lazy">
            <img src="images/random-img5.webp" alt="Bottom View of a Bridge" width="400" height="600" loading="lazy">
            <img src="images/random-img6.webp" alt="Highway" width="400" height="600" loading="lazy">
        </picture>
    </main>
    <footer>
        <p><span id="currentyear"></span> 🌴 Lance Lorenzo 🌴 Philippines</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
